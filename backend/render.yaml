services:
  - type: web
    name: sitescore-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
